apiVersion: v1
kind: Pod
metadata:
  name: cpu-b
  namespace: lab
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: hh-pairs:1.0
      imagePullPolicy: Never
      command: ["sleep", "900"]
      resources:
        requests:
          cpu: 2000m
          memory: 64Mi
        limits:
          cpu: 2000m
          memory: 64Mi
