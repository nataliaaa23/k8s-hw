apiVersion: v1
kind: Pod
metadata:
  name: big-pod
  namespace: quota-lab
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: hh-pairs:1.0
      imagePullPolicy: Never
      command: ["sleep", "60"]
      resources:
        requests:
          cpu: 100m
          memory: 600Mi
        limits:
          cpu: 200m
          memory: 600Mi
