apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-measure
  namespace: lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pairs
          image: hh-pairs:1.0
          imagePullPolicy: Never
          args: ["run"]
          env:
            - name: S3_ENDPOINT
              value: "http://host.minikube.internal:9100"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
